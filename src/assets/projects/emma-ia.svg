lyse complète</text><g filter="url(#sh)"><rect x="630" y="130" width="220" height="130" rx="16" fill="url(#acc)" fill-opacity="1" stroke="none"/></g><text x="654" y="176" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif" font-weight="700" font-size="19" fill="#ffffff">Analyse IA</text><text x="654" y="208" font-family="'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="12.5" fill="#ffffff">Extraction</text><text x="654" y="230" font-family="'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="12.5" fill="#e6f6ff">Structuration</text><g filter="url(#sh)"><rect x="915" y="130" width="220" height="130" rx="16" fill="#ffffff" fill-opacity="0.92" stroke="rgba(0,163,255,0.30)"/></g><rect x="915" y="152" width="4" height="86" rx="2" fill="url(#acc)"/><text x="939" y="176" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif" font-weight="700" font-size="19" fill="#0B1B33">Synthèse</text><text x="939" y="208" font-family="'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="12.5" fill="#1d4ed8">Rapport détaillé</text><text x="939" y="230" font-family="'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="12.5" fill="#4a6285">Recommandations</text><g filter="url(#sh)"><rect x="345" y="340" width="220" height="130" rx="16" fill="#ffffff" fill-opacity="0.92" stroke="rgba(0,163,255,0.30)"/></g><rect x="345" y="362" width="4" height="86" rx="2" fill="url(#acc)"/><text x="369" y="386" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif" font-weight="700" font-size="19" fill="#0B1B33">Mémoire</text><text x="369" y="418" font-family="'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="12.5" fill="#1d4ed8">1 conversation</text><text x="369" y="440" font-family="'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="12.5" fill="#4a6285">= 1 dossier</text><g filter="url(#sh)"><rect x="630" y="340" width="220" height="130" rx="16" fill="#ffffff" fill-opacity="0.92" stroke="rgba(0,163,255,0.30)"/></g><rect x="630" y="362" width="4" height="86" rx="2" fill="url(#acc)"/><text x="654" y="386" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif" font-weight="700" font-size="19" fill="#0B1B33">Réponse JSON</text><text x="654" y="418" font-family="'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="12.5" fill="#1d4ed8">Enveloppe structurée</text><text x="654" y="440" font-family="'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="12.5" fill="#4a6285">jamais de texte libre</text>
<text x="60" y="560" font-family="'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="13" font-weight="500" fill="#1d4ed8">emma-IA</text>
<text x="1140" y="560" text-anchor="end" font-family="'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="13" fill="#4a6285">Outil d’aide à la décision, jamais autonome</text>
