<style>.flow{animation:dash 1.4s linear infinite}@keyframes dash{to{stroke-dashoffset:-12}}@media (prefers-reduced-motion:reduce){.flow{animation:none}}</style>
</defs>
<rect width="1200" height="600" fill="url(#bg)"/><rect width="1200" height="600" fill="url(#dots)"/>
